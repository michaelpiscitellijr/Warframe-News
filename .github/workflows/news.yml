name: Warframe news

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # lets you run it by hand from the Actions tab

concurrency:
  group: warframe-news

permissions:
  contents: write             # needed to save the "already posted" list

jobs:
  post-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Post new articles
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python warframe_news_webhook.py

      - name: Save the already-posted list
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add seen_warframe.json
          git diff --cached --quiet || (git commit -m "Update seen articles" && git push)
